<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Login</h1>
    <form method = "POST" action = "/entrar">
        <p>Nome:</p>
        <input type="text" name="nome" placeholder="Digite seu nome">

        <p>Cpf:</p>
        <input type = "number" name = "cpf" min="11111111111" max="99999999999">

        <p>Senha:</p>
        <input type="text" name="senha" placeholder="Digite a senha">
        <br>
        <br>
        <button type="submit" name = "botao_entrar">Entrar</button>
        <br>

    </form>
    <div class="mensagem">
        {% with mensagens = get_flashed_messages()%}
            {% if mensagens %}
                {%for mensagem in mensagens%}
                    <p>{{mensagem}}</p>

                {% endfor %}

            {% endif %}

        {% endwith %}
    </div>
</body>
</html>
